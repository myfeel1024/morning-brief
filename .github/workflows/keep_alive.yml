name: Render Keep-Alive

# Render 무료 티어는 유휴 ~15분 뒤 절전(spin-down)한다.
# 헬스 엔드포인트(/)를 주기적으로 핑해 봇을 깨어있게 유지 → 대화형
# 응답 즉시화 + 가격 알림(job_check_alerts) 정상 작동.
# 공개 저장소라 Actions 사용 시간은 무제한 무료.
# 주의: GitHub 스케줄은 지연/누락이 있어 완벽한 24/7은 아님(best-effort).

on:
  schedule:
    - cron: '*/10 * * * *'          # 상시: 10분마다 (절전 임계 15분보다 짧게)
    # 브리핑 직전(07:50 KST=22:50 UTC) 촘촘히 핑 → 정시 발송 시 Render가
    # 확실히 깨어있도록 보장. GitHub 지연 대비 여러 번 시도.
    - cron: '30,38,44,48 22 * * 0-4'  # 07:30/38/44/48 KST (월~금)
  workflow_dispatch:               # 수동 실행용

# 여러 핑이 겹치지 않게 최신 것만 유지
concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 헬스 엔드포인트 핑 (콜드스타트 고려 재시도)
        run: |
          curl -fsS -m 90 --retry 3 --retry-delay 15 --retry-all-errors \
            https://morning-brief-bot-cvfd.onrender.com/ \
            && echo "  → awake OK"

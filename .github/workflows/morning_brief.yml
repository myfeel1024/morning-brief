name: 코스피 모닝 브리핑

on:
  # 정시 발송은 Render 내부 스케줄러(07:50 정각)가 담당 — keep_alive.yml로
  # Render를 깨워둔다. GitHub Actions cron은 지연이 심해(08:42·10:39 등
  # 들쭉날쭉) 정시 발송에 부적합하므로 비활성화. 수동/폴백용으로만 유지.
  # schedule:
  #   - cron: '50 22 * * 0-4'
  workflow_dispatch:            # 수동 실행·폴백용

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance requests anthropic pillow beautifulsoup4 lxml

      - name: 모닝 브리핑 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY:       ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_brief.py

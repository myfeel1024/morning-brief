name: 코스피 모닝 브리핑

on:
  # 외부 cron이 단일 소스 — Render 무료 티어는 절전(spin-down) 시 내부
  # job_queue 타이머가 안 울려 브리핑을 놓침(2026-07-31 미발송 원인).
  # GitHub Actions는 Render 상태와 무관하게 항상 실행되므로 신뢰 가능.
  schedule:
    - cron: '50 22 * * 0-4'   # 월~금 22:50 UTC = 화~토 07:50 KST
  workflow_dispatch:            # 수동 테스트용

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance requests anthropic pillow beautifulsoup4 lxml

      - name: 모닝 브리핑 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY:       ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_brief.py
